<!doctype html>
<!-- Hand-written stand-in for Outlook's DOM, shaped like the selector registry's guesses.
     Replace with scrubbed real pages in test/fixtures/ once the DOM survey is done. -->
<html>
  <body>
    <div role="navigation">
      <div role="tree" aria-label="Folders">
        <div role="treeitem" aria-level="1" title="Inbox">Inbox</div>
        <div role="treeitem" aria-level="2" title="Receipts">Receipts</div>
        <div role="treeitem" aria-level="1" title="Archive">Archive</div>
      </div>
    </div>
    <div id="MailList" role="listbox"></div>
    <input id="topSearchInput" aria-label="Search" />
    <button aria-label="New mail">New mail</button>
    <button aria-label="Copilot">Copilot</button>
    <script>
      window.received = [];
      document.addEventListener("keydown", (e) => received.push(`${e.key}:${e.isTrusted}`));
      for (const item of document.querySelectorAll('[role="treeitem"]')) {
        item.addEventListener("click", () => (document.title = `folder:${item.title}`));
      }
    </script>
  </body>
</html>
