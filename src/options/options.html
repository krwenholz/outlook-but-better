<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Overlook options</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      /* Also the toolbar popup, so keep it narrow and short. */
      body {
        margin: 12px 16px 16px;
        width: 380px;
      }
      select {
        font: inherit;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.7;
        margin: 16px 0 6px;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 2px 0;
      }
    </style>
  </head>
  <body>
    <form id="settings"></form>
    <script src="options.js"></script>
  </body>
</html>
