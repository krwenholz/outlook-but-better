name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - uses: jdx/mise-action@v2
        timeout-minutes: 5
      - name: Install dependencies
        timeout-minutes: 5
        run: mise run install
      - name: Install Chromium for e2e
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Check (lint, typecheck, unit, build, e2e)
        timeout-minutes: 8
        run: mise run check
